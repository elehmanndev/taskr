services:
  db:
    image: mysql:8.0
    container_name: taskr-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: taskr
      MYSQL_USER: taskr
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskr}
    volumes:
      - ${DATA_PATH:-./data}/mysql:/var/lib/mysql
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskr-redis
    restart: unless-stopped
    volumes:
      - ${DATA_PATH:-./data}/redis:/data
    ports:
      - '${REDIS_PORT:-6380}:6379'

  server:
    build: ./server
    container_name: taskr-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: mysql://taskr:${MYSQL_PASSWORD:-taskr}@db:3306/taskr
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@taskr.app}
      CLIENT_URL: ${CLIENT_URL:-https://taskr.example.com}
      NODE_ENV: production
      PORT: 3001
    ports:
      - '${SERVER_PORT:-3001}:3001'

  client:
    container_name: taskr-client
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${CLIENT_PORT:-3000}:80'

  # Auto-deploy webhook — receives GitHub pings and rebuilds the app.
  # Expose via your own Cloudflare Tunnel hostname → http://webhook:9000
  # (e.g. deploy-taskr.example.com). Then register that URL as the GitHub
  # webhook payload URL on your fork.
  webhook:
    build: ./deploy
    container_name: taskr-webhook
    restart: unless-stopped
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      COMPOSE_PROJECT_NAME: taskr
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/repo

  # Cloudflare Tunnel — exposes taskr.example.com without port forwarding
  # Create tunnel at https://one.dash.cloudflare.com → Networks → Tunnels
  # Route: taskr.example.com → http://client:80
  # Route: api.taskr.example.com → http://server:3001 (or use /api path routing)
  tunnel:
    image: cloudflare/cloudflared:2026.3.0
    container_name: taskr-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - client
      - server
